name: Release

# Publishing a GitHub Release (e.g. `gh release create v0.2.0 --generate-notes`)
# builds the macOS, Linux and Windows binaries, attaches them to the release and publishes
# the npm package through trusted publishing (OIDC). npm trusts this file by name.
on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      # For the attestation of what is built: see the last step.
      id-token: write
      attestations: write
    strategy:
      # One target failing must not cancel the others before they attach their
      # archives.
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          # Static binaries: one file per architecture runs on any distribution.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          # Experimental: see the README.
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-latest }
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
      TARGET: ${{ matrix.target }}
    # The steps are written for bash, which the Windows runner also has.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Check the tag matches Cargo.toml
        run: |
          # jq writes CRLF on Windows, and bash keeps the carriage return.
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version' | tr -d '\r')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Release tag $TAG does not match Cargo.toml version $version"
            exit 1
          fi
      - run: cargo build --release --locked --target "$TARGET"
      - name: Attach the archive to the release
        run: |
          name="otto-$TARGET"
          # Windows gets otto.exe in a zip; the others a tar.xz.
          case "$TARGET" in
            *windows*) bin=otto.exe; archive="$name.zip" ;;
            *) bin=otto; archive="$name.tar.xz" ;;
          esac
          mkdir "$name"
          cp "target/$TARGET/release/$bin" README.md LICENSE "$name/"
          case "$archive" in
            *.zip) 7z a "$archive" "$name" >/dev/null ;;
            *) tar -cJf "$archive" "$name" ;;
          esac
          # `sha256sum` is missing from macOS and `shasum` from the Windows
          # runner's bash; the line is written by hand so it reads the same
          # everywhere.
          if command -v sha256sum >/dev/null; then
            sum=$(sha256sum "$archive" | cut -d " " -f 1)
          else
            sum=$(shasum -a 256 "$archive" | cut -d " " -f 1)
          fi
          printf "%s  %s\n" "$sum" "$archive" > "$archive.sha256"
          cat "$archive.sha256" >> checksums.txt
          gh release upload "$TAG" "$archive" "$archive.sha256" --clobber
      - name: Attach the .deb to the release
        if: contains(matrix.target, 'linux')
        run: |
          case "$TARGET" in
            x86_64-*) arch=amd64 ;;
            aarch64-*) arch=arm64 ;;
          esac
          version="${TAG#v}"
          scripts/build-deb.sh "target/$TARGET/release/otto" "$version" "$arch" deb
          deb="otto_${version}_$arch.deb"
          (cd deb && sha256sum "$deb" > "$deb.sha256")
          cat "deb/$deb.sha256" >> checksums.txt
          gh release upload "$TAG" "deb/$deb" "deb/$deb.sha256" --clobber
      # Says, signed through GitHub, that the files attached above were built
      # by this workflow from this commit. Whoever downloads one checks it with
      # `gh attestation verify <file> --repo tarcisiopgs/otto`. It is kept by
      # GitHub, not attached: the files of the release are the same as before.
      # It comes last and may fail: a release is not held back by what is an
      # extra, and the npm package is published all the same.
      - name: Attest what was built
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        continue-on-error: true
        with:
          subject-checksums: checksums.txt

  npm:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5 or newer; no token is stored anywhere.
      - run: npm install -g npm@latest
      - name: Assemble the package
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          mkdir dl
          gh release download "$TAG" --pattern 'otto-*.tar.xz' --pattern 'otto-*.zip' --dir dl
          # One package carries every binary: trusted publishing cannot create a
          # package name, so a package per platform would need a manual
          # bootstrap for each one.
          for entry in \
            "darwin-arm64:aarch64-apple-darwin" \
            "darwin-x64:x86_64-apple-darwin" \
            "linux-arm64:aarch64-unknown-linux-musl" \
            "linux-x64:x86_64-unknown-linux-musl" \
            "win32-arm64:aarch64-pc-windows-msvc" \
            "win32-x64:x86_64-pc-windows-msvc"; do
            IFS=: read -r SYSTEM TARGET <<< "$entry"
            case "$SYSTEM" in
              win32-*) BIN=otto.exe; unzip -q "dl/otto-$TARGET.zip" -d dl ;;
              *) BIN=otto; tar -xJf "dl/otto-$TARGET.tar.xz" -C dl ;;
            esac
            mkdir -p "npm/otto/bin/$SYSTEM"
            cp "dl/otto-$TARGET/$BIN" "npm/otto/bin/$SYSTEM/$BIN"
            chmod +x "npm/otto/bin/$SYSTEM/$BIN"
          done
          cd npm/otto
          cp ../../LICENSE ../../README.md .
          # npm renders the README outside the repository; point its local
          # links at this release.
          sed -i "s#(examples/jobs.toml)#(https://github.com/tarcisiopgs/otto/blob/$TAG/examples/jobs.toml)#g" README.md
          npm pkg set version="$VERSION"
      - name: Check the package runs
        working-directory: npm/otto
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          # This runner is linux-x64, so the launcher and that binary are the
          # ones that can be run here.
          got=$(node bin/otto.js --version)
          if [ "$got" != "otto $VERSION" ]; then
            echo "::error::The packaged binary reports '$got', expected 'otto $VERSION'"
            exit 1
          fi
          for system in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            test -x "bin/$system/otto"
          done
          for system in win32-arm64 win32-x64; do
            test -f "bin/$system/otto.exe"
          done
      - name: Publish
        working-directory: npm/otto
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          # Re-running a release must not fail on a version already on npm.
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version already published, skipping"
          else
            npm publish --provenance --access public
          fi
