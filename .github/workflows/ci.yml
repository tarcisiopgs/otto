name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Windows too: clippy only sees `#[cfg(windows)]` code when it builds there.
  lint:
    name: Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  # Each scheduler backend only matters on its own OS, so the suite runs on all three.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  # The same targets, shell and steps as release.yml, so a pull request cannot
  # break the next release: that workflow only runs when one is published.
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-latest }
    env:
      TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: The version reads the way the release compares it
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version' | tr -d '\r')
          expected=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1 | tr -d '\r')
          echo "cargo metadata: [$version], Cargo.toml: [$expected]"
          test -n "$version" && test "$version" = "$expected"
      - run: cargo build --release --locked --target "$TARGET"
      - name: The archive is built the way the release builds it
        run: |
          name="otto-$TARGET"
          case "$TARGET" in
            *windows*) bin=otto.exe; archive="$name.zip" ;;
            *) bin=otto; archive="$name.tar.xz" ;;
          esac
          mkdir "$name"
          cp "target/$TARGET/release/$bin" README.md LICENSE "$name/"
          case "$archive" in
            *.zip) 7z a "$archive" "$name" >/dev/null ;;
            *) tar -cJf "$archive" "$name" ;;
          esac
          if command -v sha256sum >/dev/null; then
            sum=$(sha256sum "$archive" | cut -d " " -f 1)
          else
            sum=$(shasum -a 256 "$archive" | cut -d " " -f 1)
          fi
          test -n "$sum"
          ls -l "$archive"

  # The Windows backend has no machine to be tried on, so the runner is that
  # machine: a real `otto sync` registers a task with Task Scheduler, the task
  # is run, and its record is read back.
  windows:
    name: Windows Task Scheduler
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Sync, run and remove a job for real
        shell: pwsh
        run: scripts/windows-smoke.ps1

  # `check` is the single status to require on main; it passes only when every job above passes.
  check:
    name: check
    if: always()
    needs: [lint, test, build, windows]
    runs-on: ubuntu-latest
    steps:
      # Require `success` from every job instead of listing the bad results: a job
      # no runner ever picked up ends as cancelled, yet the old
      # `contains(needs.*.result, 'cancelled')` evaluated to false and let it through.
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if ! echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null; then
            echo "::error::A required job did not pass"
            exit 1
          fi
